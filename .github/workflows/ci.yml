name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Windows Forms needs the Windows desktop targeting pack.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModernTechnics.slnx

      - name: Build
        run: dotnet build ModernTechnics.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ModernTechnics.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/ModernTechnics.App --configuration Release --runtime win-x64 --self-contained false --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: ModernTechnics-win-x64
          path: publish
          if-no-files-found: error
